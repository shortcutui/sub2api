name: Fork images

on:
  push:
    branches: [dev, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: 验证更新源和镜像版本管理
        working-directory: backend
        run: go test -tags=unit ./internal/service -run '^TestUpdateService' -count=1

  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: 确定镜像和应用版本
        id: metadata
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME}-${GITHUB_SHA:0:12}"
          base_version=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          {
            echo "image_ref=$image:$tag"
            echo "version=$base_version-${GITHUB_REF_NAME}.${GITHUB_SHA:0:12}"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建前后端和测试镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ steps.metadata.outputs.image_ref }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.metadata.outputs.date }}
            BUILD_TYPE=container
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=fork-images-amd64
          cache-to: type=gha,mode=max,scope=fork-images-amd64
      - name: 验证全新数据库初始化和页面访问
        env:
          SUB2API_IMAGE: ${{ steps.metadata.outputs.image_ref }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
        run: bash deploy/tests/fork-image-smoke.sh
      - name: 发布已验证镜像
        env:
          IMAGE_REF: ${{ steps.metadata.outputs.image_ref }}
        run: |
          docker push "$IMAGE_REF"
          pinned_image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF")
          {
            echo '### 镜像构建与初始化验证通过'
            echo
            echo "- 镜像：\`$IMAGE_REF\`"
            echo "- 固定摘要：\`$pinned_image\`"
            echo "- 提交：\`$GITHUB_SHA\`"
            echo '- 架构：`linux/amd64`'
            echo '- 此工作流只发布镜像，不连接或更新服务器。'
          } >> "$GITHUB_STEP_SUMMARY"
